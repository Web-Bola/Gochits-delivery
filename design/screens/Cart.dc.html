<!doctype html>
<html lang="ka">
<head>
<meta charset="utf-8">
<title>კალათა</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;600;800&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Noto Sans Georgian',system-ui,sans-serif}
a{text-decoration:none;color:inherit}
button{font-family:inherit;cursor:pointer}
@keyframes up{0%{transform:translateY(18px);opacity:0}100%{transform:translateY(0);opacity:1}}
@keyframes out{0%{transform:translateX(0);opacity:1}100%{transform:translateX(60px);opacity:0}}
@keyframes bag{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
.in{animation:up .5s ease-out both}
.bagi{animation:bag 2.4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.in,.bagi{animation:none}}
</style>
</helmet>
<div style="position:relative;width:390px;height:844px;box-sizing:border-box;overflow:hidden;background:#FFF8E1;display:flex;flex-direction:column">
<div style="display:flex;align-items:center;justify-content:space-between;padding:24px 20px 12px">
<div style="display:flex;align-items:center;gap:12px">
<a href="Menu.dc.html" aria-label="უკან" style="width:44px;height:44px;border-radius:22px;background:#1A0D0B;display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFCC02" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></a>
<h1 style="margin:0;font-weight:800;font-size:22px;color:#1A0D0B">კალათა</h1>
</div>
<button onClick="{{clear}}" style="min-height:44px;border:0;background:transparent;color:#D8141C;font-weight:800;font-size:14px">გასუფთავება</button>
</div>
<sc-if value="{{has}}" hint-placeholder-val="{{ true }}">
<div style="flex:1;overflow-y:auto;padding:4px 20px 150px;display:flex;flex-direction:column;gap:12px">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="2">
<div class="in" style="{{r.delay}}background:#fff;border-radius:22px;padding:12px;display:flex;gap:12px;box-shadow:0 4px 12px rgba(26,13,11,.06)">
<img src="{{r.photo}}" alt="{{r.name}}" style="width:76px;height:76px;border-radius:16px;object-fit:cover;flex-shrink:0;display:block">
<div style="flex:1;min-width:0;display:flex;flex-direction:column;justify-content:space-between">
<div style="display:flex;flex-direction:column;gap:2px"><span style="font-weight:800;font-size:15px;color:#1A0D0B">{{r.name}}</span><span style="font-size:12px;color:#6b5a52">[არჩეული ოფციები]</span></div>
<div style="display:flex;align-items:center;justify-content:space-between">
<span style="font-weight:800;font-size:15px;color:#D8141C">₾ {{r.line}}</span>
<div style="display:flex;align-items:center;gap:4px;background:#FFF1BF;border-radius:22px;padding:2px">
<button onClick="{{r.dec}}" aria-label="შემცირება" style="width:44px;height:44px;border-radius:22px;border:0;background:#fff;display:flex;align-items:center;justify-content:center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1A0D0B" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"/></svg></button>
<span style="min-width:22px;text-align:center;font-weight:800;font-size:16px;color:#1A0D0B">{{r.qty}}</span>
<button onClick="{{r.inc}}" aria-label="გაზრდა" style="width:44px;height:44px;border-radius:22px;border:0;background:#1A0D0B;display:flex;align-items:center;justify-content:center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFCC02" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
</div>
</div>
</div>
</div>
</sc-for>
<div class="in" style="animation-delay:.2s;background:#FFF1BF;border-radius:18px;padding:12px 14px;font-size:13px;color:#1A0D0B;line-height:1.5">მინიმალური შეკვეთა და მიტანის ღირებულება დამოკიდებულია მისამართზე: [წესი რესტორნისგან]</div>
</div>
<div style="position:absolute;left:0;right:0;bottom:0;padding:14px 16px 22px;background:#fff;border-radius:28px 28px 0 0;box-shadow:0 -8px 24px rgba(26,13,11,.1);display:flex;flex-direction:column;gap:10px">
<div style="display:flex;justify-content:space-between;font-weight:800;font-size:16px;color:#1A0D0B"><span>პროდუქტები</span><span>₾ {{sub}}</span></div>
<a href="Checkout.dc.html" style="min-height:58px;border-radius:29px;background:#D8141C;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;box-shadow:0 10px 20px rgba(216,20,28,.35)">გაგრძელება</a>
</div>
</sc-if>
<sc-if value="{{empty}}" hint-placeholder-val="{{ false }}">
<div class="in" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:0 40px">
<div class="bagi" style="width:110px;height:110px;border-radius:55px;background:#FFCC02;display:flex;align-items:center;justify-content:center"><svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="#1A0D0B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8h12l-1 12H7z"/><path d="M9 8a3 3 0 0 1 6 0"/></svg></div>
<h2 style="margin:0;font-weight:800;font-size:20px;color:#1A0D0B">კალათა ცარიელია</h2>
<span style="font-size:14px;color:#6b5a52;line-height:1.5">დაამატე პროდუქტები მენიუდან</span>
<a href="Menu.dc.html" style="min-height:52px;padding:0 28px;border-radius:26px;background:#1A0D0B;color:#FFCC02;display:flex;align-items:center;font-weight:800;font-size:15px">მენიუში დაბრუნება</a>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { q: [1, 2] };
}
renderVals() {
const q = this.state.q;
const rows = [];
q.forEach((n, i) => {
if (n > 0) rows.push({
name: ['Double Smashed', 'Gochits Burger'][i],
photo: ['/_blob/2496ac46218bdf27cecb1b3112f90f12', '/_blob/677cb6c3eeaa638858ca918fec51aec6'][i],
line: ((n * [1746, 1379][i]) / 100).toFixed(2),
qty: n,
delay: 'animation-delay:' + (i * 80) + 'ms;',
inc: () => { const x = this.state.q.slice(); x[i] += 1; this.setState({ q: x }); },
dec: () => { const x = this.state.q.slice(); x[i] = Math.max(0, x[i] - 1); this.setState({ q: x }); }
});
});
let sub = 0;
q.forEach((n, i) => { sub += n * [1746, 1379][i]; });
return { rows, sub: (sub / 100).toFixed(2), has: rows.length > 0, empty: rows.length === 0, clear: () => this.setState({ q: [0, 0] }) };
}
}
</script>
</body>
</html>
