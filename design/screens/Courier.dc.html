<!doctype html>
<html lang="ka">
<head>
<meta charset="utf-8">
<title>კურიერი: მთავარი</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;600;800&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Noto Sans Georgian',system-ui,sans-serif}
a{text-decoration:none;color:inherit}
button{font-family:inherit;cursor:pointer}
@keyframes radar{0%{transform:scale(.3);opacity:.7}100%{transform:scale(1.6);opacity:0}}
@keyframes cardIn{0%{transform:translateY(40px) scale(.96);opacity:0}100%{transform:translateY(0) scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:rotate(0)}20%{transform:rotate(-8deg)}40%{transform:rotate(8deg)}60%{transform:rotate(-5deg)}80%{transform:rotate(5deg)}}
@keyframes drain{0%{transform:scaleX(1)}100%{transform:scaleX(0)}}
.rad{position:absolute;border-radius:50%;border:3px solid #FFCC02;animation:radar 2.8s ease-out infinite}
.offer{animation:cardIn .6s cubic-bezier(.2,.9,.3,1.1) both}
.bell{animation:shake 1.4s ease-in-out infinite}
.timer{transform-origin:left;animation:drain 30s linear forwards}
.sw{transition:background .25s ease}
.knob{transition:transform .25s cubic-bezier(.3,1.3,.5,1)}
@media (prefers-reduced-motion:reduce){.rad,.offer,.bell,.timer{animation:none}.sw,.knob{transition:none}}
</style>
</helmet>
<div style="position:relative;width:390px;height:844px;box-sizing:border-box;overflow:hidden;background:#1A0D0B;color:#fff;display:flex;flex-direction:column;padding:24px 20px 28px;gap:20px">
<div style="display:flex;align-items:center;justify-content:space-between">
<img src="/_blob/503cabd4940cb54d2a25bf4fdd509bb8" alt="Gochita" style="height:44px;width:auto">
<span style="font-weight:600;font-size:13px;color:#FFCC02;border:2px solid #FFCC02;border-radius:16px;padding:6px 12px">კურიერი</span>
</div>
<div style="display:flex;align-items:center;justify-content:space-between;background:#2A1814;border-radius:24px;padding:16px 18px">
<div style="display:flex;flex-direction:column;gap:2px">
<span style="font-weight:800;font-size:18px">{{statusTitle}}</span>
<span style="font-size:13px;color:#d9c9bd">{{statusSub}}</span>
</div>
<button role="switch" aria-checked="{{online}}" aria-label="ონლაინ სტატუსი" onClick="{{toggle}}" class="sw" style="{{swStyle}}">
<span class="knob" style="{{knobStyle}}"></span>
</button>
</div>
<sc-if value="{{online}}" hint-placeholder-val="{{ true }}">
<div style="position:relative;height:210px;display:flex;align-items:center;justify-content:center;flex-shrink:0">
<div class="rad" style="width:200px;height:200px"></div>
<div class="rad" style="width:200px;height:200px;animation-delay:.9s"></div>
<div class="rad" style="width:200px;height:200px;animation-delay:1.8s"></div>
<div class="bell" style="position:relative;width:76px;height:76px;border-radius:38px;background:#FFCC02;display:flex;align-items:center;justify-content:center">
<svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#1A0D0B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 17V11a6 6 0 0 1 12 0v6l2 2H4z"/><path d="M10 21a2 2 0 0 0 4 0"/></svg>
</div>
</div>
<div class="offer" style="background:#FFCC02;color:#1A0D0B;border-radius:28px;padding:18px;display:flex;flex-direction:column;gap:14px">
<div style="display:flex;justify-content:space-between;align-items:center"><span style="font-weight:800;font-size:18px">ახალი მიტანა</span><span style="font-weight:800;font-size:15px;background:#1A0D0B;color:#FFCC02;border-radius:14px;padding:4px 12px">[X] კმ</span></div>
<div style="display:flex;flex-direction:column;gap:10px">
<div style="display:flex;gap:12px;align-items:center"><span style="width:14px;height:14px;border-radius:7px;background:#1A0D0B;flex-shrink:0"></span><span style="font-weight:600;font-size:14px">აიღე: [ფილიალის მისამართი]</span></div>
<div style="display:flex;gap:12px;align-items:center"><span style="width:14px;height:14px;border-radius:7px;background:#D8141C;flex-shrink:0"></span><span style="font-weight:600;font-size:14px">მიიტანე: [უბანი]</span></div>
</div>
<div style="display:flex;justify-content:space-between;font-size:13px;font-weight:600"><span>გადახდა: [ბარათი / ნაღდი]</span><span>[თანხა]</span></div>
<div style="height:6px;border-radius:3px;background:rgba(26,13,11,.2);overflow:hidden"><div class="timer" style="height:6px;background:#D8141C"></div></div>
<a href="CourierDelivery.dc.html" style="min-height:56px;border-radius:28px;background:#1A0D0B;color:#FFCC02;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px">მიღება</a>
</div>
</sc-if>
<sc-if value="{{offline}}" hint-placeholder-val="{{ false }}">
<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;color:#d9c9bd">
<svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#FFCC02" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
<span style="font-size:15px;line-height:1.5;max-width:260px">ჩართე სტატუსი, რომ მიტანები მიიღო</span>
</div>
</sc-if>
<div style="margin-top:auto;display:flex;align-items:center;gap:10px;font-size:12px;color:#d9c9bd;background:#2A1814;border-radius:16px;padding:12px 14px">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFCC02" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink:0"><path d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>
შენი ლოკაცია ჩანს მხოლოდ აქტიური მიტანის დროს
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { online: true };
}
renderVals() {
const on = this.state.online;
return {
online: on,
offline: !on,
toggle: () => this.setState({ online: !this.state.online }),
statusTitle: on ? 'ონლაინ ხარ' : 'ხაზგარეშე ხარ',
statusSub: on ? 'ველოდებით ახალ მიტანას' : 'მიტანებს ვერ მიიღებ',
swStyle: 'width:72px;height:44px;border-radius:22px;border:0;padding:4px;display:flex;align-items:center;' + (on ? 'background:#FFCC02;justify-content:flex-end;' : 'background:#5a4640;justify-content:flex-start;'),
knobStyle: 'width:36px;height:36px;border-radius:18px;display:block;' + (on ? 'background:#1A0D0B;' : 'background:#fff;')
};
}
}
</script>
</body>
</html>
