<!doctype html>
<html lang="ka">
<head>
<meta charset="utf-8">
<title>ნებართვები</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;600;800&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Noto Sans Georgian',system-ui,sans-serif}
a{text-decoration:none;color:inherit}
button{font-family:inherit;cursor:pointer}
@keyframes up{0%{transform:translateY(20px);opacity:0}100%{transform:translateY(0);opacity:1}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes ok{0%{transform:scale(.4)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
.in{animation:up .5s ease-out both}
.pl{animation:pulse 2.2s ease-in-out infinite}
.ok{animation:ok .4s ease-out}
@media (prefers-reduced-motion:reduce){.in,.pl,.ok{animation:none}}
</style>
</helmet>
<div style="position:relative;width:390px;height:844px;box-sizing:border-box;overflow:hidden;background:#FFCC02;display:flex;flex-direction:column;padding:28px 22px 30px;gap:18px">
<div class="in" style="display:flex;flex-direction:column;gap:6px;margin-top:20px">
<h1 style="margin:0;font-weight:800;font-size:28px;color:#1A0D0B">ორი მცირე ნებართვა</h1>
<span style="font-size:14px;color:#1A0D0B;line-height:1.5">რომ მიტანა სწრაფი და ზუსტი იყოს. ორივე შეგიძლია მოგვიანებით შეცვალო პარამეტრებში</span>
</div>
<div class="in" style="animation-delay:.1s;background:#fff;border-radius:26px;padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:0 10px 24px rgba(26,13,11,.15)">
<div style="display:flex;gap:14px;align-items:center">
<div class="pl" style="width:56px;height:56px;border-radius:28px;background:#D8141C;display:flex;align-items:center;justify-content:center;flex-shrink:0"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg></div>
<div style="display:flex;flex-direction:column;gap:2px"><span style="font-weight:800;font-size:16px;color:#1A0D0B">ლოკაცია</span><span style="font-size:13px;color:#6b5a52;line-height:1.4">მისამართის სწრაფად ამოსარჩევად და მიტანის ზონის შესამოწმებლად</span></div>
</div>
<button onClick="{{grantLoc}}" style="{{b0}}">{{l0}}</button>
</div>
<div class="in" style="animation-delay:.2s;background:#fff;border-radius:26px;padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:0 10px 24px rgba(26,13,11,.15)">
<div style="display:flex;gap:14px;align-items:center">
<div class="pl" style="width:56px;height:56px;border-radius:28px;background:#1A0D0B;display:flex;align-items:center;justify-content:center;flex-shrink:0;animation-delay:.4s"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#FFCC02" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 17V11a6 6 0 0 1 12 0v6l2 2H4z"/><path d="M10 21a2 2 0 0 0 4 0"/></svg></div>
<div style="display:flex;flex-direction:column;gap:2px"><span style="font-weight:800;font-size:16px;color:#1A0D0B">შეტყობინებები</span><span style="font-size:13px;color:#6b5a52;line-height:1.4">შეკვეთის სტატუსის შესახებ: მიღება, გზაში, მივიდა</span></div>
</div>
<button onClick="{{grantPush}}" style="{{b1}}">{{l1}}</button>
</div>
<a href="Address.dc.html" class="in" style="animation-delay:.3s;margin-top:auto;min-height:56px;border-radius:28px;background:#1A0D0B;color:#FFCC02;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px">გაგრძელება</a>
<a href="Address.dc.html" style="min-height:44px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:#1A0D0B">ახლა არა</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { loc: false, push: false };
}
renderVals() {
const s = this.state;
const btn = (on) => 'min-height:50px;border-radius:25px;font-weight:800;font-size:15px;transition:all .25s ease;' + (on ? 'background:#FFF1BF;color:#1A0D0B;border:2px solid #1A0D0B;' : 'background:#D8141C;color:#fff;border:0;');
return {
grantLoc: () => this.setState({ loc: true }),
grantPush: () => this.setState({ push: true }),
b0: btn(s.loc), b1: btn(s.push),
l0: s.loc ? '✓ ნებართვა მიცემულია' : 'ნებართვის მიცემა',
l1: s.push ? '✓ ნებართვა მიცემულია' : 'ნებართვის მიცემა'
};
}
}
</script>
</body>
</html>
