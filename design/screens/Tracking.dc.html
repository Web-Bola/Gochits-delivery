<!doctype html>
<html lang="ka">
<head>
<meta charset="utf-8">
<title>შეკვეთის თვალყური</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;600;800&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Noto Sans Georgian',system-ui,sans-serif}
a{text-decoration:none;color:inherit}
@keyframes ping{0%{transform:scale(.6);opacity:.8}100%{transform:scale(2.4);opacity:0}}
@keyframes sheetUp{0%{transform:translateY(60px);opacity:0}100%{transform:translateY(0);opacity:1}}
@keyframes ride{0%{offset-distance:0%}100%{offset-distance:100%}}
@keyframes dash{to{stroke-dashoffset:-40}}
@keyframes stepPop{0%{transform:scale(.5)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
.ping{transform-origin:center;transform-box:fill-box;animation:ping 1.8s ease-out infinite}
.sheet{animation:sheetUp .7s cubic-bezier(.2,.9,.3,1.1) both}
.route{stroke-dasharray:10 10;animation:dash 1.4s linear infinite}
.courier{offset-path:path('M60 560 L60 430 L170 430 L170 300 L290 300 L290 210');offset-rotate:0deg;animation:ride 9s ease-in-out infinite alternate}
.pop{animation:stepPop .45s ease-out}
@media (prefers-reduced-motion:reduce){.ping,.sheet,.route,.courier,.pop{animation:none}}
</style>
</helmet>
<div style="position:relative;width:390px;height:844px;box-sizing:border-box;overflow:hidden;background:#FFF1BF">
<svg width="390" height="600" viewBox="0 0 390 600" style="position:absolute;left:0;top:0" role="img" aria-label="რუკის ილუსტრაცია, კურიერი მოდის მისამართისკენ">
<rect width="390" height="600" fill="#FFF1BF"/>
<g fill="#FFE59A">
<rect x="-10" y="40" width="130" height="90" rx="14"/>
<rect x="150" y="30" width="110" height="140" rx="14"/>
<rect x="300" y="60" width="100" height="100" rx="14"/>
<rect x="-10" y="170" width="140" height="80" rx="14"/>
<rect x="210" y="330" width="90" height="170" rx="14"/>
<rect x="320" y="300" width="80" height="120" rx="14"/>
<rect x="100" y="340" width="40" height="60" rx="10"/>
</g>
<g fill="none" stroke="#fff" stroke-width="22" stroke-linecap="round">
<path d="M60 600 V430 H170 V300 H290 V150 V0"/>
<path d="M-10 300 H390"/>
<path d="M120 0 V600"/>
<path d="M230 150 H390"/>
</g>
<path class="route" d="M60 560 L60 430 L170 430 L170 300 L290 300 L290 210" fill="none" stroke="#D8141C" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<g>
<circle class="ping" cx="290" cy="210" r="16" fill="#D8141C"/>
<circle cx="290" cy="210" r="12" fill="#D8141C" stroke="#fff" stroke-width="4"/>
</g>
<g>
<circle cx="60" cy="560" r="12" fill="#1A0D0B" stroke="#fff" stroke-width="4"/>
</g>
</svg>
<div class="courier" style="position:absolute;left:0;top:0;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:22px;background:#FFCC02;border:4px solid #1A0D0B;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 16px rgba(26,13,11,.3)">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1A0D0B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="17" r="3"/><circle cx="18" cy="17" r="3"/><path d="M6 17l4-8h5l3 8M10 9L8 6H5"/></svg>
</div>
<a href="Menu.dc.html" aria-label="უკან" style="position:absolute;left:18px;top:22px;width:44px;height:44px;border-radius:22px;background:#1A0D0B;display:flex;align-items:center;justify-content:center">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFCC02" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
</a>
<div class="sheet" style="position:absolute;left:0;right:0;bottom:0;height:440px;box-sizing:border-box;background:#fff;border-radius:32px 32px 0 0;box-shadow:0 -12px 30px rgba(26,13,11,.16);padding:12px 20px 20px;display:flex;flex-direction:column;gap:16px">
<div style="width:44px;height:5px;border-radius:3px;background:#E8DDB8;align-self:center"></div>
<div style="display:flex;align-items:center;justify-content:space-between">
<div style="display:flex;flex-direction:column;gap:2px">
<span style="font-size:13px;color:#6b5a52;font-weight:600">შეკვეთა №[ნომერი]</span>
<span style="font-weight:800;font-size:22px;color:#1A0D0B">{{title}}</span>
</div>
<div style="background:#FFCC02;border-radius:16px;padding:8px 14px;text-align:center">
<div style="font-weight:800;font-size:18px;color:#1A0D0B">[X] წთ</div>
<div style="font-size:11px;font-weight:600;color:#1A0D0B">სავარაუდოდ</div>
</div>
</div>
<div style="display:flex;flex-direction:column;gap:0">
<sc-for list="{{steps}}" as="s" hint-placeholder-count="5">
<div style="display:flex;gap:14px;align-items:stretch;min-height:42px">
<div style="display:flex;flex-direction:column;align-items:center;width:26px">
<div class="{{s.cls}}" style="{{s.dot}}"><sc-if value="{{s.done}}" hint-placeholder-val="{{ true }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFCC02" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg></sc-if></div>
<div style="{{s.line}}"></div>
</div>
<div style="{{s.text}}">{{s.label}}</div>
</div>
</sc-for>
</div>
<div style="display:flex;align-items:center;gap:12px;background:#FFF8E1;border-radius:20px;padding:12px;margin-top:auto">
<div style="width:48px;height:48px;border-radius:24px;background:#D8141C;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800">კ</div>
<div style="flex:1;display:flex;flex-direction:column"><span style="font-weight:800;font-size:15px;color:#1A0D0B">[კურიერის სახელი]</span><span style="font-size:12px;color:#6b5a52">თქვენი კურიერი</span></div>
<button aria-label="დარეკვა" style="width:48px;height:48px;border-radius:24px;border:0;background:#1A0D0B;display:flex;align-items:center;justify-content:center;cursor:pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFCC02" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg></button>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { step: 2 };
this.timer = null;
}
componentDidMount() {
this.timer = setInterval(() => {
this.setState({ step: (this.state.step + 1) % 5 });
}, 3200);
}
componentWillUnmount() {
if (this.timer) clearInterval(this.timer);
}
renderVals() {
const labels = ['შეკვეთა მიღებულია', 'რესტორანმა დაადასტურა', 'მზადდება', 'კურიერი გზაშია', 'მიტანილია'];
const cur = this.state.step;
const steps = labels.map((label, i) => {
const done = i < cur;
const active = i === cur;
return {
label,
done,
cls: active ? 'pop' : '',
dot: 'width:26px;height:26px;border-radius:13px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;flex-shrink:0;' + (done ? 'background:#1A0D0B;' : active ? 'background:#D8141C;border:4px solid #FFCC02;' : 'background:#fff;border:3px solid #E8DDB8;'),
line: i === labels.length - 1 ? 'display:none' : 'flex:1;width:4px;border-radius:2px;margin:2px 0;' + (done ? 'background:#1A0D0B;' : 'background:#E8DDB8;'),
text: 'padding-top:2px;font-size:15px;' + (active ? 'font-weight:800;color:#D8141C;' : done ? 'font-weight:600;color:#1A0D0B;' : 'font-weight:400;color:#8a7a70;')
};
});
return { steps, title: labels[cur] };
}
}
</script>
</body>
</html>
