renderVals() {
const s = this.state;
const q = s.q.trim().toLowerCase();
const cats = this.cats.map((label, i) => ({
label,
pick: () => this.setState({ cat: i }),
style: 'min-height:44px;padding:0 16px;border-radius:22px;white-space:nowrap;font-weight:800;font-size:13px;border:2px solid #1A0D0B;' + (s.cat === i ? 'background:#1A0D0B;color:#FFCC02' : 'background:transparent;color:#1A0D0B')
}));
const list = this.D.filter((d) => (q ? d[1].toLowerCase().indexOf(q) >= 0 : d[0] === s.cat));
const items = list.map((d, i) => {
const sale = d[3] > 0;
return {
name: d[1],
desc: d[5] || '',
price: this.fmt(d[2]),
old: sale ? this.fmt(d[3]) : '',
sale,
pct: sale ? '−' + Math.round((1 - d[2] / d[3]) * 100) + '%' : '',
photo: d[4] ? this.P[d[4]] : '',
hasPhoto: !!d[4],
noPhoto: !d[4],
delay: 'animation-delay:' + Math.min(i, 6) * 60 + 'ms;',
add: () => this.setState({ count: this.state.count + 1, sum: this.state.sum + d[2], bump: this.state.bump + 1 })
};
});
return {
cats,
items,
none: items.length === 0,
onSearch: (e) => this.setState({ q: String(e.target.value) }),
count: s.count,
total: this.fmt(s.sum),
hasCart: s.count > 0,
bumpClass: s.bump % 2 === 1 ? 'bump' : 'bump2'
};
}
