<!doctype html>
<html lang="ka">
<head>
<meta charset="utf-8">
<title>მისამართის დამატება</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;600;800&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Noto Sans Georgian',system-ui,sans-serif}
a{text-decoration:none;color:inherit}
button{font-family:inherit;cursor:pointer}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
@keyframes shadow{0%,100%{transform:scale(1);opacity:.35}50%{transform:scale(.6);opacity:.15}}
@keyframes up{0%{transform:translateY(24px);opacity:0}100%{transform:translateY(0);opacity:1}}
@keyframes zone{0%,100%{transform:scale(1);opacity:.35}50%{transform:scale(1.12);opacity:.15}}
.pin{animation:hop 1.3s ease-in-out infinite}
.pinsh{animation:shadow 1.3s ease-in-out infinite}
.sheet{animation:up .6s cubic-bezier(.2,.9,.3,1.1) both}
.zn{animation:zone 3s ease-in-out infinite}
.fld:focus-within{border-color:#1A0D0B;box-shadow:0 0 0 4px rgba(255,204,2,.6)}
@media (prefers-reduced-motion:reduce){.pin,.pinsh,.sheet,.zn{animation:none}}
</style>
</helmet>
<div style="position:relative;width:390px;height:844px;box-sizing:border-box;overflow:hidden;background:#FFF1BF">
<svg width="390" height="360" viewBox="0 0 390 360" style="position:absolute;left:0;top:0" role="img" aria-label="რუკის ილუსტრაცია">
<rect width="390" height="360" fill="#FFF1BF"/>
<g fill="#FFE59A"><rect x="-10" y="30" width="120" height="100" rx="14"/><rect x="140" y="20" width="100" height="90" rx="14"/><rect x="270" y="40" width="130" height="80" rx="14"/><rect x="-10" y="190" width="100" height="120" rx="14"/><rect x="270" y="200" width="130" height="100" rx="14"/><rect x="130" y="230" width="90" height="100" rx="14"/></g>
<g fill="none" stroke="#fff" stroke-width="20" stroke-linecap="round"><path d="M-10 160H400"/><path d="M120 -10V370"/><path d="M250 -10V370"/><path d="M-10 340H400"/></g>
</svg>
<div class="zn" style="position:absolute;left:105px;top:60px;width:180px;height:180px;border-radius:50%;background:#FFCC02;border:3px dashed #1A0D0B"></div>
<div style="position:absolute;left:171px;top:150px;width:48px;height:12px;display:flex;justify-content:center"><div class="pinsh" style="width:30px;height:10px;border-radius:50%;background:#1A0D0B"></div></div>
<div class="pin" style="position:absolute;left:163px;top:96px;width:64px;height:64px;display:flex;justify-content:center">
<svg width="52" height="64" viewBox="0 0 24 30" aria-hidden="true"><path d="M12 29s9-8 9-16A9 9 0 0 0 3 13c0 8 9 16 9 16z" fill="#D8141C" stroke="#1A0D0B" stroke-width="1.6"/><circle cx="12" cy="13" r="3.6" fill="#FFCC02" stroke="#1A0D0B" stroke-width="1.4"/></svg>
</div>
<a href="Register.dc.html" aria-label="უკან" style="position:absolute;left:18px;top:22px;width:44px;height:44px;border-radius:22px;background:#1A0D0B;display:flex;align-items:center;justify-content:center">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFCC02" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
</a>
<label style="position:absolute;left:76px;right:18px;top:22px;min-height:44px;border-radius:22px;background:#fff;box-shadow:0 6px 16px rgba(26,13,11,.15);display:flex;align-items:center;gap:8px;padding:0 14px;box-sizing:border-box">
<span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">მისამართის ძებნა</span>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1A0D0B" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
<input type="text" placeholder="მოძებნე მისამართი" style="border:0;outline:0;flex:1;min-width:0;font-family:inherit;font-size:14px;font-weight:600;color:#1A0D0B;background:transparent">
</label>
<div class="sheet" style="position:absolute;left:0;right:0;bottom:0;top:310px;background:#fff;border-radius:32px 32px 0 0;box-shadow:0 -12px 30px rgba(26,13,11,.14);padding:18px 20px 22px;display:flex;flex-direction:column;gap:12px;box-sizing:border-box;overflow-y:auto">
<div style="display:flex;align-items:center;justify-content:space-between;background:#FFF8E1;border-radius:16px;padding:10px 14px">
<span style="font-size:13px;font-weight:800;color:#1A0D0B">მიტანის ზონა: [ზონა]</span><span style="font-size:13px;font-weight:800;color:#D8141C">მიტანა ₾ --.--</span>
</div>
<div style="display:flex;gap:8px">
<sc-for list="{{labels}}" as="l" hint-placeholder-count="3"><button onClick="{{l.pick}}" style="{{l.style}}">{{l.text}}</button></sc-for>
</div>
<div class="fld" style="border:2px solid #E8DDB8;border-radius:16px;padding:0 14px;min-height:50px;display:flex;align-items:center"><input type="text" aria-label="ქუჩა და სახლის ნომერი" autocomplete="street-address" placeholder="ქუჩა და სახლის ნომერი" style="border:0;outline:0;flex:1;min-width:0;font-family:inherit;font-weight:600;font-size:15px;color:#1A0D0B;background:transparent"></div>
<div style="display:flex;gap:10px">
<div class="fld" style="flex:1;border:2px solid #E8DDB8;border-radius:16px;padding:0 12px;min-height:50px;display:flex;align-items:center"><input type="text" aria-label="სადარბაზო" placeholder="სადარბაზო" style="border:0;outline:0;width:100%;min-width:0;font-family:inherit;font-weight:600;font-size:15px;color:#1A0D0B;background:transparent"></div>
<div class="fld" style="flex:1;border:2px solid #E8DDB8;border-radius:16px;padding:0 12px;min-height:50px;display:flex;align-items:center"><input type="text" aria-label="სართული" placeholder="სართული" style="border:0;outline:0;width:100%;min-width:0;font-family:inherit;font-weight:600;font-size:15px;color:#1A0D0B;background:transparent"></div>
<div class="fld" style="flex:1;border:2px solid #E8DDB8;border-radius:16px;padding:0 12px;min-height:50px;display:flex;align-items:center"><input type="text" aria-label="ბინა" placeholder="ბინა" style="border:0;outline:0;width:100%;min-width:0;font-family:inherit;font-weight:600;font-size:15px;color:#1A0D0B;background:transparent"></div>
</div>
<div class="fld" style="border:2px solid #E8DDB8;border-radius:16px;padding:0 14px;min-height:50px;display:flex;align-items:center"><input type="text" aria-label="კომენტარი კურიერისთვის" placeholder="კომენტარი კურიერისთვის" style="border:0;outline:0;flex:1;min-width:0;font-family:inherit;font-weight:600;font-size:15px;color:#1A0D0B;background:transparent"></div>
<a href="BranchPick.dc.html" style="margin-top:auto;min-height:56px;border-radius:28px;background:#D8141C;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;box-shadow:0 10px 20px rgba(216,20,28,.35)">მისამართის შენახვა</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { label: 0 };
}
renderVals() {
const names = ['სახლი', 'სამსახური', 'სხვა'];
return {
labels: names.map((text, i) => ({
text,
pick: () => this.setState({ label: i }),
style: 'flex:1;min-height:44px;border-radius:22px;font-weight:800;font-size:14px;border:2px solid #1A0D0B;' + (this.state.label === i ? 'background:#1A0D0B;color:#FFCC02;' : 'background:#fff;color:#1A0D0B;')
}))
};
}
}
</script>
</body>
</html>
