<!doctype html>
<html lang="ka">
<head>
<meta charset="utf-8">
<title>მდგომარეობები</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;600;800&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Noto Sans Georgian',system-ui,sans-serif}
a{text-decoration:none;color:inherit}
button{font-family:inherit;cursor:pointer}
@keyframes up{0%{transform:translateY(18px);opacity:0}100%{transform:translateY(0);opacity:1}}
@keyframes zz{0%,100%{transform:translateY(0);opacity:1}50%{transform:translateY(-8px);opacity:.6}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes wob{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
.in{animation:up .5s ease-out both}
.zz{animation:zz 2s ease-in-out infinite}
.bl{animation:blink 1.4s ease-in-out infinite}
.wb{animation:wob 2.2s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.in,.zz,.bl,.wb{animation:none}}
</style>
</helmet>
<div style="position:relative;width:390px;height:844px;box-sizing:border-box;overflow:hidden;background:#FFF8E1;display:flex;flex-direction:column;padding:24px 22px 30px;gap:18px">
<div style="display:flex;gap:6px;align-self:center;background:#FFE59A;border-radius:22px;padding:4px">
<button onClick="{{s0}}" style="{{t0}}">დახურულია</button>
<button onClick="{{s1}}" style="{{t1}}">ინტერნეტი</button>
<button onClick="{{s2}}" style="{{t2}}">ზონა</button>
</div>
<sc-if value="{{closed}}" hint-placeholder-val="{{ true }}">
<div class="in" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center">
<div style="position:relative;width:130px;height:130px;border-radius:65px;background:#1A0D0B;display:flex;align-items:center;justify-content:center">
<svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="#FFCC02" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
<span class="zz" style="position:absolute;right:6px;top:10px;font-weight:800;font-size:22px;color:#FFCC02">z</span>
</div>
<h1 style="margin:0;font-weight:800;font-size:24px;color:#1A0D0B">ახლა დახურულია</h1>
<span style="font-size:14px;color:#6b5a52;line-height:1.5;max-width:280px">შეკვეთებს ვიღებთ [სამუშაო საათები]. შეგიძლია მენიუს დათვალიერება</span>
</div>
<a href="Menu.dc.html" style="min-height:56px;border-radius:28px;background:#1A0D0B;color:#FFCC02;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px">მენიუს ნახვა</a>
</sc-if>
<sc-if value="{{offline}}" hint-placeholder-val="{{ false }}">
<div class="in" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center">
<div class="wb" style="width:130px;height:130px;border-radius:65px;background:#FFCC02;display:flex;align-items:center;justify-content:center">
<svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#1A0D0B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 9a15 15 0 0 1 20 0M5 13a10 10 0 0 1 14 0M8.5 16.5a5 5 0 0 1 7 0"/><circle class="bl" cx="12" cy="20" r="1.2" fill="#D8141C" stroke="#D8141C"/><path d="M3 3l18 18" stroke="#D8141C"/></svg>
</div>
<h1 style="margin:0;font-weight:800;font-size:24px;color:#1A0D0B">კავშირი არ არის</h1>
<span style="font-size:14px;color:#6b5a52;line-height:1.5;max-width:280px">შეამოწმე ინტერნეტი და სცადე თავიდან. შენი კალათა შენახულია</span>
</div>
<button style="min-height:56px;border-radius:28px;border:0;background:#D8141C;color:#fff;font-weight:800;font-size:16px;box-shadow:0 10px 20px rgba(216,20,28,.35)">ხელახლა ცდა</button>
</sc-if>
<sc-if value="{{zone}}" hint-placeholder-val="{{ false }}">
<div class="in" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center">
<div style="width:130px;height:130px;border-radius:65px;background:#FFF1BF;border:3px dashed #1A0D0B;display:flex;align-items:center;justify-content:center">
<svg class="wb" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#D8141C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21z"/><path d="M9 7l6 6M15 7l-6 6" stroke="#1A0D0B"/></svg>
</div>
<h1 style="margin:0;font-weight:800;font-size:24px;color:#1A0D0B">ამ მისამართზე ვერ მივიტანთ</h1>
<span style="font-size:14px;color:#6b5a52;line-height:1.5;max-width:280px">შენი მისამართი მიტანის ზონაში არ შედის. სცადე სხვა მისამართი: [მიტანის ზონები]</span>
</div>
<a href="Address.dc.html" style="min-height:56px;border-radius:28px;background:#1A0D0B;color:#FFCC02;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px">სხვა მისამართი</a>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { s: 0 };
}
renderVals() {
const s = this.state.s;
const tab = (i) => 'min-height:44px;padding:0 12px;border-radius:20px;border:0;font-weight:800;font-size:13px;' + (s === i ? 'background:#1A0D0B;color:#FFCC02;' : 'background:transparent;color:#1A0D0B;');
return {
closed: s === 0, offline: s === 1, zone: s === 2,
s0: () => this.setState({ s: 0 }), s1: () => this.setState({ s: 1 }), s2: () => this.setState({ s: 2 }),
t0: tab(0), t1: tab(1), t2: tab(2)
};
}
}
</script>
</body>
</html>
