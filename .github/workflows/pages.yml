name: publish
# Publishes the customer app (web) and the dashboard to GitHub Pages.
# One-time setup in GitHub: Settings -> Pages -> Source: "GitHub Actions";
# Settings -> Secrets and variables -> Actions -> Variables: SUPABASE_URL, SUPABASE_ANON_KEY (public/publishable key only).
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Check variables
        run: |
          test -n "$SUPABASE_URL" -a -n "$SUPABASE_ANON_KEY" || { echo "::error::Add repository variables SUPABASE_URL and SUPABASE_ANON_KEY (Settings -> Secrets and variables -> Actions -> Variables)"; exit 1; }
      - name: Build dashboard
        working-directory: apps/dashboard
        env:
          STATIC_EXPORT: '1'
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}/panel
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: npx next build
      - name: Build customer app
        working-directory: apps/customer-app
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          node -e "const f='app.json',j=JSON.parse(require('fs').readFileSync(f));j.expo.experiments={...(j.expo.experiments||{}),baseUrl:'/${{ github.event.repository.name }}/app'};require('fs').writeFileSync(f,JSON.stringify(j,null,2))"
          npx expo export --platform web --output-dir dist
          cp dist/index.html dist/404.html
      - name: Build courier app
        working-directory: apps/courier-app
        env:
          EXPO_PUBLIC_GOOGLE_MAPS_KEY: ${{ vars.GOOGLE_MAPS_KEY }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          node -e "const f='app.json',j=JSON.parse(require('fs').readFileSync(f));j.expo.experiments={...(j.expo.experiments||{}),baseUrl:'/${{ github.event.repository.name }}/courier'};require('fs').writeFileSync(f,JSON.stringify(j,null,2))"
          npx expo export --platform web --output-dir dist
          cp dist/index.html dist/404.html
      - name: Assemble site
        run: |
          mkdir -p site
          cp -r apps/dashboard/out site/panel
          cp -r apps/customer-app/dist site/app
          cp -r apps/courier-app/dist site/courier
          cp site/panel/index.html site/panel/404.html 2>/dev/null || true
          printf '<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gochit'"'"'s</title><body style="font-family:sans-serif;padding:24px"><h2>Gochit'"'"'s</h2><p><a href="app/">აპი</a></p><p><a href="panel/restaurant/">რესტორნის პანელი</a></p><p><a href="courier/">კურიერის აპი</a></p><p><a href="panel/admin/">ადმინი</a></p>' > site/index.html
          touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.d.outputs.page_url }}' }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
